name: "Bug Report"
description: Report a forecast-desk bug, crash, or incorrect behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the sections below so we can reproduce it and keep forecast-ledger artifacts auditable.

        **Before submitting**, please:
        - [ ] Search existing issues in this fork to avoid duplicates
        - [ ] Record the exact assigned beta release before changing or upgrading it
        - [ ] Run `superforecasting-agent debug share --local`, review the output, and attach only information safe to share

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what's broken. Include error messages, tracebacks, or screenshots if relevant.
      placeholder: |
        What happened? What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to trigger the bug. The more specific, the faster we can fix it.
      placeholder: |
        1. Run `forecast --db /path/to/test.db ...`
        2. Create or open forecast id ...
        3. Import/update/self-check/score ...
        4. Error appears: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include full error output if available.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of Superforecasting Agent is affected?
      multiple: true
      options:
        - Forecast CLI / ledger
        - Evidence source adapters
        - Backtesting / benchmark replay
        - Calibration / scoring / postmortems
        - Scheduled self-checks / alerts
        - TUI / dashboard forecast view
        - Optional chat / agent loop
        - Gateway / messaging alerts
        - Setup / Installation
        - Tools / plugins / skills
        - Configuration (config.yaml, .env, setup)
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Messaging Platform (if gateway-related)
      description: Which platform adapter is affected?
      multiple: true
      options:
        - N/A (CLI only)
        - Telegram
        - Discord
        - Slack
        - WhatsApp

  - type: textarea
    id: debug-report
    attributes:
      label: Debug Report
      description: |
        Run `superforecasting-agent debug share --local` and review the report before attaching it.
        It includes installed backend/TUI versions, system information, configuration and logs.
        Secrets are redacted by default, but private forecast text and paths may remain.

        For an intentional public upload, `superforecasting-agent debug share` uploads immediately.

        Do not include API keys, raw profiles or private ledger exports. A minimal synthetic reproduction is preferred.
      placeholder: |
        Assigned release: ...
        Installed backend: ...
        Installed terminal: ...
        Reviewed diagnostic excerpt: ...
      render: shell
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating System
      description: e.g. Ubuntu 24.04, macOS 15.2, Windows 11
      placeholder: Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Output of `python --version`
      placeholder: "3.11.9"

  - type: input
    id: superforecasting-agent-version
    attributes:
      label: Superforecasting Agent Version
      description: Assigned release tag and installed backend/TUI versions from the local debug report; include the commit for a source build
      placeholder: "Assigned tag: v0.22.4; backend: 0.22.4; terminal: 0.1.1"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Additional Logs / Traceback (optional)
      description: |
        The debug report above covers most logs. Use this field for any extra error output, 
        tracebacks, forecast command output, or screenshots not captured by the debug report.
      render: shell

  - type: textarea
    id: root-cause
    attributes:
      label: Root Cause Analysis (optional)
      description: |
        If you've dug into the code and identified the root cause, share it here.
        Include file paths, line numbers, and code snippets if possible. This massively speeds up fixes.
      placeholder: |
        The bug is in `gateway/run.py` line 949. `len(history)` counts session_meta entries
        but `agent_messages` was built from filtered history...

  - type: textarea
    id: proposed-fix
    attributes:
      label: Proposed Fix (optional)
      description: If you have a fix in mind (or a PR ready), describe it here.
      placeholder: |
        Replace `.get()` with `.pop()` on line 289 of `gateway/platforms/base.py`
        to actually clear the pending message after retrieval.

  - type: checkboxes
    id: pr-ready
    attributes:
      label: Are you willing to submit a PR for this?
      options:
        - label: I'd like to fix this myself and submit a PR
