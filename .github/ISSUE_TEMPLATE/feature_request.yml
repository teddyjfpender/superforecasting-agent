name: "Feature Request"
description: Suggest a forecast-desk feature or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Forecast-native requests should explain how the change improves research, probability updates, evidence capture, scoring, calibration, backtesting, or tester workflow quality.

        Before submitting, please search existing issues in this fork. For missing data feeds or public APIs, prefer the Source Adapter Request template.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What problem does this solve? What are you trying to do that you can't today?
      placeholder: |
        I am trying to maintain forecasts about [domain/topic], but currently
        there is no way to represent, review, score, or backtest...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you think this should work? Be specific about CLI flags, ledger records, UI behavior, or config options.
      placeholder: |
        Add a `forecast ...` command or flag that...
        Or: Add a ledger field/report that...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider? Why is the proposed solution better?

  - type: dropdown
    id: type
    attributes:
      label: Feature Type
      options:
        - Forecast lifecycle / ledger
        - Evidence source adapter
        - Backtesting / benchmark replay
        - Scoring / calibration / learning
        - Scheduled self-checks / alerts
        - CLI / TUI / dashboard ergonomics
        - Gateway / messaging alerts
        - Configuration option
        - Performance / reliability
        - Developer experience (tests, docs, CI)
        - Other
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: How big is this change?
      options:
        - Small (single file, < 50 lines)
        - Medium (few files, < 300 lines)
        - Large (new module or significant refactor)

  - type: checkboxes
    id: pr-ready
    attributes:
      label: Contribution
      options:
        - label: I'd like to implement this myself and submit a PR

  - type: textarea
    id: debug-report
    attributes:
      label: Debug Report (optional)
      description: |
        If this feature request is related to a problem you're experiencing, run `superforecasting-agent debug share` and paste the links here.
        In an interactive chat session, you can use `/debug` instead.
        This helps us understand your environment and any related logs.
      placeholder: |
        Report   https://paste.rs/abc123
      render: shell
