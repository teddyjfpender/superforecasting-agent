name: "Setup / Installation Help"
description: Having trouble installing or configuring Superforecasting Agent? Ask here.
title: "[Setup]: "
labels: ["setup"]
body:
  - type: markdown
    attributes:
      value: |
        Sorry you are having trouble. Please fill out the details below so we can help reproduce the setup issue.

        **Quick checks first:**
        - Run `superforecasting-agent debug share --local` and review it before attaching safe diagnostics
        - The `/debug` shortcut uploads immediately; use local diagnostics first
        - Keep the failing assigned release and report its tag and installed versions
        - Check the [beta recovery guide](https://github.com/teddyjfpender/superforecasting-agent/blob/superforecasting-agent-snapshot/website/docs/getting-started/tester-pilot.md#4-recover-without-losing-the-reproduction)
        - For general questions, use fork discussions or file an issue with the details below

  - type: textarea
    id: description
    attributes:
      label: What's Going Wrong?
      description: Describe what you're trying to do and where it fails.
      placeholder: |
        I ran `superforecasting-agent setup` and selected Nous Portal, but when I try to
        open the forecast desk I get...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps Taken
      description: What did you do? Include the exact commands you ran.
      placeholder: |
        1. Downloaded the assigned beta wheels and verified their checksums
        2. Installed both wheels in an isolated Python environment
        3. Selected OpenRouter, entered API key
        4. Ran `superforecasting-agent tui` and got error...
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation Method
      options:
        - Assigned beta wheels in an isolated environment
        - Install script
        - Manual clone + pip/uv install
        - PowerShell installer (Windows)
        - Docker
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: Ubuntu 24.04 / macOS 15.2 / Windows 11
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Output of `python --version` (or `python3 --version`)
      placeholder: "3.11.9"

  - type: input
    id: superforecasting-agent-version
    attributes:
      label: Superforecasting Agent Version
      description: Assigned release tag, installed backend/TUI versions from local diagnostics, and source commit if applicable
      placeholder: "v0.22.1; backend 0.22.1; terminal 0.1.1"
    validations:
      required: true

  - type: textarea
    id: debug-report
    attributes:
      label: Debug Report
      description: |
        Run `superforecasting-agent debug share --local` and review the output before attaching it.
        Default redaction masks secrets, but private forecast text and paths may remain.
        Do not attach raw profiles, credentials or private ledgers.
        If installation failed before diagnostics became available, attach the exact safe error text.
      placeholder: |
        Assigned release: ...
        Installed backend: ...
        Installed terminal: ...
        Reviewed diagnostic excerpt: ...
      render: shell

  - type: textarea
    id: error-output
    attributes:
      label: Full Error Output
      description: Paste the complete error message or traceback. This will be auto-formatted.
      render: shell
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What I've Already Tried
      description: List any fixes or workarounds you've already attempted.
      placeholder: |
        - Verified the assigned wheel checksums
        - Ran `python -m pip check` in the beta environment
        - Checked that OPENROUTER_API_KEY is set in ~/.superforecasting-agent/.env
