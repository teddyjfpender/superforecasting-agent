name: Superforecasting Agent smoke test
description: >
  Run the image's built-in entrypoint against `--help` and `dashboard --help`
  to catch basic runtime regressions before publishing.  Requires the image
  to already be loaded into the local Docker daemon under `image`.

  Works identically on amd64 and arm64 runners.

inputs:
  image:
    description: Fully-qualified image tag (e.g. teddyjfpender/superforecasting-agent:test)
    required: true

runs:
  using: composite
  steps:
    - name: Ensure /tmp/superforecasting-agent-test is writable
      shell: bash
      run: |
        # The image still runs as the inherited hermes user (UID 10000).
        # GitHub Actions creates /tmp/superforecasting-agent-test root-owned by default, which the container user
        # can't write to — chown it to match the in-container UID before
        # bind-mounting.  Real users doing `docker run -v ~/.superforecasting-agent:...`
        # with their own UID hit the same issue and have their own
        # remediations (SUPERFORECASTING_AGENT_UID, FORECAST_UID, or compatibility HERMES_UID).
        mkdir -p /tmp/superforecasting-agent-test
        sudo chown -R 10000:10000 /tmp/superforecasting-agent-test

    - name: superforecasting-agent --help
      shell: bash
      run: |
        docker run --rm \
          -v /tmp/superforecasting-agent-test:/opt/data \
          --entrypoint /opt/hermes/docker/entrypoint.sh \
          "${{ inputs.image }}" --help

    - name: superforecasting-agent dashboard --help
      shell: bash
      run: |
        # Regression guard for #9153: dashboard was present in source but
        # missing from the published image.  If this fails, something in
        # the Dockerfile is excluding the dashboard subcommand from the
        # installed package.
        docker run --rm \
          -v /tmp/superforecasting-agent-test:/opt/data \
          --entrypoint /opt/hermes/docker/entrypoint.sh \
          "${{ inputs.image }}" dashboard --help
