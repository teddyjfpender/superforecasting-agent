name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Protocol codegen staleness gate
        run: |
          source .venv/bin/activate
          # Fails if ui-tui/src/protocol/generated.ts is out of date with the
          # protocol/ pydantic models. Fix: python -m protocol.codegen
          scripts/check-protocol.sh

      - name: Run tests
        run: |
          source .venv/bin/activate
          # Hermetic-CI discipline: exclude env-coupled tests (real network /
          # real credentials) — same policy as the release run. See
          # CONTRIBUTING.md → "Hermetic tests".
          EXCLUDED=$(python -m pytest tests/ --collect-only -q -o addopts="" \
            --ignore=tests/integration --ignore=tests/e2e \
            -m "requires_network or requires_credentials" 2>/dev/null \
            | grep -cE '::' || true)
          echo "excluded ${EXCLUDED} env-coupled tests (requires_network / requires_credentials)"
          python -m pytest tests/ -q --ignore=tests/integration --ignore=tests/e2e \
            -m "not integration and not requires_network and not requires_credentials" \
            --tb=short -n auto --timeout=30 --timeout-method=signal
        env:
          # Ensure tests don't accidentally call real APIs
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Run e2e tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/e2e/ -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  # TUI gate: type-check + full vitest suite + lint for ui-tui. The release
  # pipeline bundles ui-tui into the wheel, so its suite must be as blocking
  # as the Python one. Node 22 matches the release workflows' build jobs
  # (root package.json engines requires >=20).
  tui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui-tui/package-lock.json

      - name: Install dependencies
        run: cd ui-tui && npm ci

      - name: Type-check
        run: cd ui-tui && npm run type-check

      - name: Run TUI tests
        run: cd ui-tui && npm run test

      - name: Lint (warning ratchet)
        # --max-warnings pins the current warning count (0 errors) as a
        # RATCHET: it may only ever go DOWN, never up. The residual warnings
        # are React Compiler bailouts in ui-tui/src/lib/usePm*.ts plus one
        # exhaustive-deps — a known, separately-tracked burn-down. Fixed a
        # warning? Lower the number here AND in production-release.yml's
        # tui job.
        run: cd ui-tui && npm run lint -- --max-warnings 54
