name: Tests

on:
  schedule:
    # Full suites + a clean-room release build. Schedule runs from the default
    # branch, so it catches dependency/toolchain drift even without a commit.
    - cron: '17 2 * * *'
  push:
    branches: [main, superforecasting-agent-snapshot]
  pull_request:
    branches: [main, superforecasting-agent-snapshot]

permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # 8.2.0
        with:
          version: '0.10.9'

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          # [all] deliberately excludes lazy backend SDKs from user installs.
          # The full unit suite mocks these backends but still imports their SDKs.
          uv sync --locked --group full-test --extra all \
            --extra anthropic --extra hindsight --extra parallel-web \
            --extra fal --extra modal --extra daytona --extra vercel

      - name: Protocol codegen staleness gate
        run: |
          source .venv/bin/activate
          # Fails if ui-tui/src/protocol/generated.ts is out of date with the
          # protocol/ pydantic models. Fix: python -m protocol.codegen
          scripts/check-protocol.sh

      - name: Run tests
        run: |
          source .venv/bin/activate
          # Hermetic-CI discipline: exclude env-coupled tests (real network /
          # real credentials) — same policy as the release run. See
          # CONTRIBUTING.md → "Hermetic tests".
          EXCLUDED=$(python -m pytest tests/ --collect-only -q -o addopts="" \
            --ignore=tests/integration --ignore=tests/e2e \
            -m "requires_network or requires_credentials" 2>/dev/null \
            | grep -cE '::' || true)
          echo "excluded ${EXCLUDED} env-coupled tests (requires_network / requires_credentials)"
          python -m pytest tests/ -q --ignore=tests/integration --ignore=tests/e2e \
            -m "not integration and not requires_network and not requires_credentials" \
            --tb=short -n auto --timeout=30 --timeout-method=signal
        env:
          # Ensure tests don't accidentally call real APIs
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # 8.2.0
        with:
          version: '0.10.9'

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Run e2e tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/e2e/ -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  python-compat:
    name: Python ${{ matrix.python }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # 8.2.0
        with:
          version: '0.10.9'
      - name: Install package and focused compatibility suite
        run: |
          uv python install "${{ matrix.python }}"
          uv venv .venv --python "${{ matrix.python }}"
          uv pip install --python .venv -e ".[dev]"
          .venv/bin/python -m pytest -q \
            tests/test_packaging_metadata.py \
            tests/hermes_cli/test_build_version_signal.py \
            tests/forecasting/test_refresh.py

  windows-release-installer:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Parse native release installer
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install-release.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Verify a published release asset set without installing
        shell: powershell
        run: scripts/install-release.ps1 -Tag v0.19.0 -VerifyOnly

  # TUI gate: type-check + full vitest suite + lint for ui-tui. The release
  # pipeline bundles ui-tui into the wheel, so its suite must be as blocking
  # as the Python one. Node 22 matches the release workflows' build jobs
  # (root package.json engines requires >=20).
  tui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui-tui/package-lock.json

      - name: Install dependencies
        run: cd ui-tui && npm ci

      - name: Type-check
        run: cd ui-tui && npm run type-check

      - name: Run TUI tests
        run: cd ui-tui && npm run test

      - name: Lint (zero warnings)
        run: cd ui-tui && npm run lint

  nightly-release-smoke:
    if: github.event_name == 'schedule'
    needs: [test, e2e, python-compat, windows-release-installer, tui]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # 8.2.0
        with:
          version: '0.10.9'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'

      - name: Install release dependencies
        run: |
          uv venv .venv --python 3.11
          uv pip install --python .venv -e ".[all,dev]"

      - name: Build and verify the formal artifact set
        env:
          RELEASE_DIR: ${{ runner.temp }}/nightly-release
        run: |
          uv lock --check
          PYTHON=.venv/bin/python scripts/check-protocol.sh
          .venv/bin/python -m scripts.docgen --check
          SKIP_GATE=1 RELEASE_WITH_WEB=1 scripts/release.sh \
            --build-npm --out "$RELEASE_DIR"
          (cd "$RELEASE_DIR" && sha256sum -c SHA256SUMS)
          uv venv "${RUNNER_TEMP}/wheel-smoke" --python 3.11
          uv pip install --python "${RUNNER_TEMP}/wheel-smoke" \
            "$RELEASE_DIR"/superforecasting_agent-*.whl
          "${RUNNER_TEMP}/wheel-smoke/bin/superforecasting-agent" --help >/dev/null

      - name: Upload nightly artifact set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nightly-release-${{ github.run_id }}
          path: ${{ runner.temp }}/nightly-release/
          retention-days: 7
