name: Installed forecast lifecycle

on:
  pull_request:
    branches: [main, superforecasting-agent-snapshot]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.10.9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build the installable wheel with its TUI
        shell: bash
        run: bash scripts/build-release.sh
      - name: Fetch the last published baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release download v0.19.0 --pattern '*.whl' --dir previous-release
      - name: Verify fresh installation and durable upgrade
        shell: bash
        run: python scripts/verify_forecast_release.py --wheel dist/*.whl --previous-wheel previous-release/*.whl --output installed-lifecycle
      - name: Retain command receipts and artifact hashes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-lifecycle-${{ matrix.os }}
          path: installed-lifecycle/report.json
