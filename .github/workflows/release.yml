name: Release (GitHub) — bundled TUI wheel [legacy]

# SUPERSEDED by production-release.yml for tag-triggered releases.  That
# workflow owns the formal artifact set (wheel + multi-arch image + checksums +
# manifest) on SemVer tag pushes (vX.Y.Z).  This one is retained only as a
# MANUAL escape hatch (workflow_dispatch) to rebuild + attach the bundled-TUI
# wheel to an already-existing tag/release without the full pipeline.
#
# The `push: tags: v*` trigger was removed so a SemVer tag no longer races
# production-release.yml to create the same GitHub Release.
#
#     pipx install https://github.com/<owner>/<repo>/releases/download/<tag>/superforecasting_agent-<ver>-py3-none-any.whl
#     superforecasting-agent --tui
#
# It does NOT publish to PyPI (upload_to_pypi.yml owns that, if/when the fork
# configures a publisher).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v2026.6.16)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    name: Build bundled-TUI wheel + GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the Release + upload assets
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build TUI bundle
        run: cd ui-tui && npm ci && npm run build

      - name: Build web dashboard
        run: cd web && npm ci && npm run build

      - name: Bundle TUI + install scripts into hermes_cli
        run: |
          mkdir -p hermes_cli/tui_dist hermes_cli/scripts
          cp ui-tui/dist/entry.js hermes_cli/tui_dist/entry.js
          cp scripts/install.sh hermes_cli/scripts/install.sh
          cp scripts/install.ps1 hermes_cli/scripts/install.ps1

      - name: Verify bundled assets
        run: |
          test -f hermes_cli/tui_dist/entry.js || { echo "ERROR: tui_dist not built"; exit 1; }
          test -f hermes_cli/web_dist/index.html || { echo "ERROR: web_dist not built"; exit 1; }

      - name: Build wheel and sdist
        run: uv build --sdist --wheel

      - name: Stage the standalone installer as install.sh
        # Attached as a release asset so the public one-liner works:
        #   curl -fsSL .../releases/latest/download/install.sh | bash
        run: cp scripts/install-release.sh install.sh

      - name: Create GitHub Release and attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Quoted heredoc keeps markdown backticks literal; sed fills the tag.
          cat > /tmp/notes.md <<'NOTES'
          ## Install — one command

          ```bash
          curl -fsSL https://github.com/teddyjfpender/superforecasting-agent/releases/latest/download/install.sh | bash
          ```

          Then start the desk:

          ```bash
          superforecasting-agent --tui
          ```

          That's it — **no git clone, no Python venv, no `npm install`.** The script grabs the prebuilt wheel, installs it with `pipx` (installing `pipx` for you if missing), and the launcher auto-provisions Node and runs the gateway from pipx's own venv. Re-run the same command anytime to upgrade. Only prerequisite: **Python 3.10+**.

          <details>
          <summary>Pin this exact version, or install by hand</summary>

          ```bash
          curl -fsSL https://github.com/teddyjfpender/superforecasting-agent/releases/download/__TAG__/install.sh | bash
          ```

          Windows (PowerShell) and other options: see `scripts/install-release.sh` / `scripts/install.ps1`.
          </details>
          NOTES
          sed -i "s/__TAG__/$TAG/g" /tmp/notes.md
          gh release create "$TAG" dist/*.whl dist/*.tar.gz install.sh \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            --verify-tag || \
          gh release upload "$TAG" dist/*.whl dist/*.tar.gz install.sh --clobber
