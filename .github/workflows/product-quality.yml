name: Product quality
on:
  workflow_dispatch:
    inputs:
      focus:
        description: Bounded native kernel investigation or normal product qualification
        type: choice
        options: [products, windows-kernel]
        default: products
  pull_request:
  push:
    branches: [main, superforecasting-agent-snapshot]
permissions:
  contents: read
jobs:
  quality:
    if: inputs.focus != 'windows-kernel'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.10.9'
          python-version: '3.11.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Bootstrap and enforce the contributor quality gates
        run: python3 scripts/dev.py bootstrap
      - name: Enforce the shared pre-push integration tier
        run: python3 scripts/dev.py verify --tier integration
      - name: Preserve integration failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contributor-integration
          include-hidden-files: true
          path: .test-results/
  installed-products:
    if: inputs.focus != 'windows-kernel'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        node: ['20.19.2', '22']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.10.9'
          python-version: '3.11.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install terminal harness dependencies
        run: python -m pip install "psutil==7.2.2" "pywinpty==2.0.15; sys_platform == 'win32'"
      - name: Build independent products
        id: build
        run: |
          npm ci --prefix ui-tui
          python scripts/build_profiles.py
      - name: Verify terminal input, cancellation and ownership on the native platform
        shell: bash
        run: |
          uv sync --frozen --extra dev --extra web --extra pty
          scripts/run_tests.sh tests/test_terminal_session.py tests/test_constants.py tests/test_native_terminal_recovery.py
      - name: Verify persistent kernel process ownership and replay
        if: matrix.node == '22'
        shell: bash
        run: >-
          scripts/run_tests.sh tests/tools/test_code_kernel.py
          tests/tools/test_code_kernel_runner.py tests/tools/test_code_calculations.py
          tests/tools/test_code_kernel_remote.py tests/tools/test_code_kernel_supervisor.py
      - name: Verify durable background and event recovery
        if: matrix.node == '22'
        shell: bash
        run: >-
          scripts/run_tests.sh tests/storage/test_process_identity.py
          tests/storage/test_background_research.py tests/storage/test_research_jobs.py
          tests/tools/test_async_delegation.py
      - name: Verify installed backend, terminal and authenticated host
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python scripts/verify_profiles.py dist/profiles --python 3.11.15 --report qualification/report.json
      - name: Prepare pinned historical upgrade inputs
        id: baselines
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python scripts/prepare_upgrade_baselines.py
      - name: Verify installed upgrades, legacy profiles, customized skills and plugins
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.baselines.outcome == 'success' }}
        run: >-
          python scripts/verify_profiles.py dist/profiles --python 3.11.15
          --upgrade-from dist/upgrade-baselines/superforecasting_agent-0.19.0-py3-none-any.whl
          --terminal-upgrade-from dist/upgrade-baselines/superforecasting_agent_tui-0.1.0-py3-none-any.whl
          --report qualification/upgrade-report.json
      - name: Preserve platform evidence, including failures and skips
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installed-products-${{ matrix.os }}-node-${{ matrix.node }}
          include-hidden-files: true
          path: |
            qualification/
            dist/upgrade-baselines/provenance.json
            .test-results/

  windows-kernel-investigation:
    if: inputs.focus == 'windows-kernel'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.10.9'
          python-version: '3.11.15'
      - name: Install the affected runtime with locked dependencies
        run: uv sync --frozen --extra dev --extra web --extra pty
      - name: Reproduce nested-process ownership and execution deadlines
        shell: bash
        run: >-
          scripts/run_tests.sh
          tests/tools/test_code_kernel.py::test_nested_background_processes_are_stopped_before_their_parents
          tests/tools/test_code_kernel.py::test_timeout_retires_exact_process_and_requires_explicit_reset
          tests/tools/test_code_kernel.py::test_interrupted_rpc_retains_cleanup_owner_until_dispatch_exits
          tests/tools/test_code_kernel_runner.py::test_cell_and_child_stdin_cannot_consume_control_frames
      - name: Preserve bounded investigation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-kernel-investigation
          include-hidden-files: true
          path: .test-results/
