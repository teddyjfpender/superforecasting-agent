name: Production Release (formal artifact set)

# Cuts the FORMAL ARTIFACT SET for one release on a SemVer tag push (vX.Y.Z):
#   1. Independent backend and terminal wheels  2. sdist
#   3. install.sh (macOS/Linux)  4. install.ps1 (Windows)  5. SHA256SUMS
#   6. release-manifest.json (names, versions, image digest, min-migration)
#   7. multi-arch image → ghcr.io (linux/amd64 + linux/arm64), tags vX.Y.Z + latest
# and attaches 1-6 to the GitHub Release.  Mirrors scripts/release.sh so a
# local dry-run matches CI exactly.
#
# ── OPERATOR CONFIG (must be set once; this workflow does NOT fake them) ──
#   * ghcr.io image push uses the built-in GITHUB_TOKEN — no secret needed,
#     only `permissions: packages: write` (below) + repo/org setting
#     "Allow GitHub Actions to create and approve packages".  After the first
#     release, set the ghcr package visibility to Public if the docs' one-line
#     `docker pull ghcr.io/...` is meant to work unauthenticated.
#   * The wheel + release are created with GITHUB_TOKEN (permissions below).
#   * This fork is not published to PyPI. GitHub Releases is the wheel authority.
#   * Docker Hub mirroring is optional. When DOCKERHUB_USERNAME and
#     DOCKERHUB_TOKEN are configured, this job copies the already-verified GHCR
#     digest directly; it does not rely on a GITHUB_TOKEN-created release event
#     starting another workflow.
#
# This is the only GitHub Release publisher. SemVer vX.Y.Z is the single release
# scheme; workflow_dispatch is the gated recovery path for an existing tag.

on:
  push:
    tags:
      - 'v*'   # the gate below performs the strict version/tag validation
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing SemVer tag to release (e.g. v0.18.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # Gate: tag must be strict SemVer AND equal the pyproject source of truth,
  # the changelog must carry a non-empty entry, and codegen must be fresh.
  # -------------------------------------------------------------------------
  gate:
    if: github.repository == 'teddyjfpender/superforecasting-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-tags: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # 8.2.0
        with:
          version: '0.10.9'

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          uv pip install --python .venv -e ".[all,dev]"

      - name: Resolve + assert version == tag
        id: resolve
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VER="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' pyproject.toml | head -n1)"
          if [ "v${VER}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} != pyproject version v${VER}"
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify release commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin \
            "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          git merge-base --is-ancestor HEAD "origin/${DEFAULT_BRANCH}" || {
            echo "::error::release tag must point to a commit reachable from origin/${DEFAULT_BRANCH}"
            exit 1
          }

      - name: Refuse mutation of a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true || {
              echo "::error::release $TAG is already published and immutable"
              exit 1
            }
          fi

      - name: Verify lockfile
        run: uv lock --check

      - name: Readiness gate (strict)
        run: |
          set +e
          GITHUB_REF="refs/tags/${{ inputs.tag || github.ref_name }}" \
            PYTHON=.venv/bin/python \
            scripts/check-release-ready.sh --strict --version "${{ steps.resolve.outputs.version }}"
          status=$?
          if [ "$status" -ne 0 ]; then
            .venv/bin/python -m scripts.docgen --check || true
          fi
          exit "$status"

  # -------------------------------------------------------------------------
  # Suites-green: the release job depends on this, so a red suite blocks a
  # release. Mirrors tests.yml's fast lane.
  # -------------------------------------------------------------------------
  test:
    if: github.repository == 'teddyjfpender/superforecasting-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # 8.2.0
        with:
          version: '0.10.9'
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          # numpy lives in the [voice] extra (NOT [all], which excludes the
          # wheel-only STT stack). test_kokoro_tts.py / test_voice_mode.py
          # exercise real numpy WAV/audio logic, so install it explicitly here
          # rather than letting those tests silently importorskip in CI.
          # [all] deliberately excludes provider SDKs (lazy-installed at first
          # use, see pyproject LAZY_DEPS rationale) — but the hermetic-test
          # discipline bans runtime installs (HERMES_DISABLE_LAZY_INSTALLS), so
          # CI must pre-install the SDKs the suite exercises, exactly as a
          # long-lived real install accumulates them. The set below is the
          # COMPLETE list of lazy features whose tests import the real SDK
          # unguarded (no importorskip) — determined empirically from which
          # `image.*/terminal.*/search.*` tests fail with FeatureUnavailable
          # when the pin is absent. Pins mirror tools/lazy_deps.py exactly.
          #   - fal-client       image.fal        (test_image_generation, test_managed_media_gateways)
          #   - modal            terminal.modal   (test_modal_snapshot_isolation)
          #   - daytona          terminal.daytona (test_daytona_environment)
          #   - vercel           terminal.vercel  (test_vercel_sandbox_environment)
          #   - parallel-web     search.parallel  (test_web_tools_config)
          # Lazy features whose tests importorskip when the SDK is absent
          # (discord/telegram/matrix/slack/edge-tts/…) are DELIBERATELY left out:
          # they skip cleanly, and several (e.g. mautrix/python-olm) have no
          # macOS/Windows build path — the very reason lazy-install exists.
          uv sync --locked --group full-test --extra all \
            --extra anthropic --extra hindsight --extra parallel-web \
            --extra fal --extra modal --extra daytona --extra vercel
      - name: Run tests
        run: |
          source .venv/bin/activate
          # Hermetic-CI discipline (see CONTRIBUTING.md → "Hermetic tests").
          # Tests that genuinely need live network or real provider credentials
          # carry @pytest.mark.requires_network / requires_credentials. They are
          # excluded from the release run — but the exclusion is made VISIBLE,
          # never silent: count the marked tests first and print the total, so a
          # reviewer can see exactly how many env-coupled tests were skipped.
          EXCLUDED=$(python -m pytest tests/ --collect-only -q -o addopts="" \
            --ignore=tests/integration --ignore=tests/e2e \
            -m "requires_network or requires_credentials" 2>/dev/null \
            | grep -cE '::' || true)
          echo "excluded ${EXCLUDED} env-coupled tests (requires_network / requires_credentials)"
          python -m pytest tests/ -q --ignore=tests/integration --ignore=tests/e2e \
            -m "not integration and not requires_network and not requires_credentials" \
            --tb=short -n auto --timeout=60 --timeout-method=signal
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
          # Import-time home provisioning (model_tools.discover_builtin_tools ->
          # tools.approval.load_permanent_allowlist -> ensure_hermes_home) runs
          # at pytest COLLECTION, before any conftest fixture can redirect
          # HERMES_HOME. Point it at a writable throwaway dir so collection can
          # never try to mkdir /root/.superforecasting-agent on a runner whose
          # HOME is not writable.
          HERMES_HOME: ${{ runner.temp }}/hermes-home

      - name: Run E2E tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/e2e/ -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
          HERMES_HOME: ${{ runner.temp }}/hermes-home

  # -------------------------------------------------------------------------
  # TUI-green: type-check + full vitest suite + lint for ui-tui. The release
  # job below builds and ships the independent terminal wheel, so a red TUI suite
  # blocks the release exactly like a red Python suite. Mirrors tests.yml's
  # tui job.
  # -------------------------------------------------------------------------
  tui:
    if: github.repository == 'teddyjfpender/superforecasting-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui-tui/package-lock.json
      - name: Install dependencies
        run: cd ui-tui && npm ci
      - name: Type-check
        run: cd ui-tui && npm run type-check
      - name: Run TUI tests
        run: cd ui-tui && npm run test
      - name: Lint (zero warnings)
        run: cd ui-tui && npm run lint

  python-compat:
    name: Python ${{ matrix.python-version }} compatibility
    if: github.repository == 'teddyjfpender/superforecasting-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # 8.2.0
        with:
          version: '0.10.9'
      - name: Install package and focused compatibility suite
        run: |
          uv python install ${{ matrix.python-version }}
          uv venv .venv --python ${{ matrix.python-version }}
          uv pip install --python .venv -e ".[dev]"
          .venv/bin/python -m pytest -q \
            tests/test_packaging_metadata.py \
            tests/runtime_cli/test_build_version_signal.py \
            tests/forecasting/test_refresh.py

  windows-release-installer:
    if: github.repository == 'teddyjfpender/superforecasting-agent'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Parse native release installer
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install-release.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Verify split-package installer with controlled artifacts
        shell: powershell
        run: scripts/verify_windows_installer.ps1
      - name: Verify a published release asset set without installing
        shell: powershell
        run: scripts/install-release.ps1 -Tag v0.19.0 -VerifyOnly

  # -------------------------------------------------------------------------
  # Build the formal set: wheel + multi-arch image + checksums + manifest,
  # then create the GitHub Release with everything attached.
  # -------------------------------------------------------------------------
  release:
    needs: [gate, test, python-compat, windows-release-installer, tui]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # create the Release + upload assets
      packages: write   # push the image to ghcr.io (built-in GITHUB_TOKEN)
      id-token: write   # keyless Sigstore bundles for wheel + sdist
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      TAG: ${{ inputs.tag || github.ref_name }}
      IMAGE: ghcr.io/${{ github.repository }}
      REVISION: ${{ needs.gate.outputs.revision }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-tags: true
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # 8.2.0
        with:
          version: '0.10.9'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'

      - name: Build independent release products
        env:
          RELEASE_WITH_WEB: '1'
        run: scripts/build-release.sh

      - name: Verify installed local and remote product profiles
        run: python3 scripts/verify_profiles.py dist --python "$(command -v python3)"

      - name: Sign wheel + sdist with Sigstore
        uses: sigstore/gh-action-sigstore-python@04cffa1d795717b140764e8b640de88853c92acc  # v3.3.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl

      # ---- multi-arch image → ghcr.io (digest captured for the manifest) ----
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:release-smoke-${{ github.run_id }}
          labels: |
            org.opencontainers.image.revision=${{ env.REVISION }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Smoke test image
        uses: ./.github/actions/hermes-smoke-test
        with:
          image: ${{ env.IMAGE }}:release-smoke-${{ github.run_id }}

      - name: Log in to ghcr.io
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push multi-arch image
        id: image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.revision=${{ env.REVISION }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      # ---- assemble the artifact set (mirrors scripts/release.sh) ----
      - name: Assemble artifacts + checksums + manifest
        run: |
          set -euo pipefail
          cp scripts/install-release.sh dist/install.sh
          cp scripts/install-release.ps1 dist/install.ps1
          WHEEL="$(find dist -maxdepth 1 -type f -name 'superforecasting_agent-*.whl' -print -quit)"
          TUI_WHEEL="$(find dist -maxdepth 1 -type f -name 'superforecasting_agent_tui-*.whl' -print -quit)"
          SDIST="$(find dist -maxdepth 1 -type f -name 'superforecasting_agent-*.tar.gz' -print -quit)"
          test -n "$WHEEL" && test -n "$TUI_WHEEL" && test -n "$SDIST"
          test -f dist/dashboard-assets.tar.gz
          ( cd dist && sha256sum \
              "$(basename "$WHEEL")" "$(basename "$TUI_WHEEL")" "$(basename "$SDIST")" dashboard-assets.tar.gz install.sh install.ps1 > SHA256SUMS )
          python -m scripts.release_manifest build \
            --version "$VERSION" --tag "$TAG" \
            --min-migration "${RELEASE_MIN_MIGRATION:-0.17.0}" \
            --artifact "wheel=$WHEEL" \
            --artifact "terminal_wheel=$TUI_WHEEL" \
            --artifact "dashboard_assets=dist/dashboard-assets.tar.gz" \
            --artifact "sdist=$SDIST" \
            --artifact "installer=dist/install.sh" \
            --artifact "windows_installer=dist/install.ps1" \
            --artifact "checksums=dist/SHA256SUMS" \
            --image-registry ghcr.io \
            --image-repo "${{ github.repository }}" \
            --image-tag "$TAG" --image-tag latest \
            --image-platform linux/amd64 --image-platform linux/arm64 \
            --image-digest "${{ steps.image.outputs.digest }}" \
            --out dist/release-manifest.json

      - name: Scaffold release notes
        run: |
          {
            printf '# %s\n\n' "$TAG"
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { grab=1 }
              grab && seen && /^## \[/ { exit }
              grab { print; seen=1 }
            ' CHANGELOG.md
          } > dist/RELEASE_NOTES.md

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
            gh release edit "$TAG" --title "$TAG" --notes-file dist/RELEASE_NOTES.md
            gh release upload "$TAG" \
              dist/superforecasting_agent-*.whl dist/superforecasting_agent_tui-*.whl \
              dist/superforecasting_agent-*.tar.gz dist/dashboard-assets.tar.gz \
              dist/*.sigstore.json \
              dist/install.sh dist/install.ps1 dist/SHA256SUMS dist/release-manifest.json --clobber
          else
            gh release create "$TAG" \
              dist/superforecasting_agent-*.whl dist/superforecasting_agent_tui-*.whl \
              dist/superforecasting_agent-*.tar.gz dist/dashboard-assets.tar.gz \
              dist/*.sigstore.json \
              dist/install.sh dist/install.ps1 dist/SHA256SUMS dist/release-manifest.json \
              --title "$TAG" --notes-file dist/RELEASE_NOTES.md --verify-tag --draft
          fi
          find dist -maxdepth 1 -type f \( \
            -name 'superforecasting_agent-*.whl' -o -name 'superforecasting_agent_tui-*.whl' -o \
            -name 'superforecasting_agent-*.tar.gz' -o -name 'dashboard-assets.tar.gz' -o \
            -name '*.sigstore.json' -o \
            -name 'install.sh' -o -name 'install.ps1' -o \
            -name 'SHA256SUMS' -o -name 'release-manifest.json' \
          \) -printf '%f\n' | sort -u > /tmp/expected-release-assets
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort -u > /tmp/release-assets
          comm -23 /tmp/release-assets /tmp/expected-release-assets | while IFS= read -r stale; do
            test -z "$stale" || gh release delete-asset "$TAG" "$stale" --yes
          done

      - name: Verify immutable release assets and image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort -u > /tmp/release-assets
          diff -u /tmp/expected-release-assets /tmp/release-assets
          gh release download "$TAG" --dir "$VERIFY_DIR"
          while IFS= read -r asset; do
            cmp "dist/$asset" "$VERIFY_DIR/$asset"
          done < /tmp/expected-release-assets
          docker buildx imagetools inspect "$IMAGE:$TAG" | grep -F "$IMAGE_DIGEST"

      - name: Move latest after the formal release verifies
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$IMAGE_DIGEST"
          docker buildx imagetools inspect "$IMAGE:latest" | grep -F "$IMAGE_DIGEST"

      - name: Detect optional Docker Hub mirror
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub mirror skipped: credentials are not configured"
          fi

      - name: Log in to Docker Hub for formal mirror
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror verified image digest to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          DOCKERHUB_IMAGE: teddyjfpender/superforecasting-agent
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$DOCKERHUB_IMAGE:$TAG" \
            --tag "$DOCKERHUB_IMAGE:latest" \
            "$IMAGE@$IMAGE_DIGEST"
          docker buildx imagetools inspect "$DOCKERHUB_IMAGE:$TAG" | grep -F "$IMAGE_DIGEST"
          docker buildx imagetools inspect "$DOCKERHUB_IMAGE:latest" | grep -F "$IMAGE_DIGEST"

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest
