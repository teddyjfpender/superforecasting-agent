name: Docs

# The living-reference staleness gate. The pages under docs/reference/ are
# GENERATED from code (the protocol registry, the forecast-tool schema, the jobs
# registry, the provider registries, the CLI argparse tree, and the built-in
# hooks) by `python -m scripts.docgen`. This job fails if any of them is out of
# date with its source — "generated reference docs are stale" becomes an
# unmissable build error instead of prose that quietly drifts from the system.
#
# Fix on failure:  python -m scripts.docgen   (then commit docs/reference/*.md)

on:
  push:
    branches: [main, superforecasting-agent-snapshot]
  pull_request:
    branches: [main, superforecasting-agent-snapshot]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-staleness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install locked contributor runtime
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.10.9'
          python-version: '3.11.15'

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra web --extra pty

      - name: Verify stale-reference rejection and safe argument handling
        run: scripts/run_tests.sh tests/scripts/test_docgen_gate.py -q

      - name: Reference-docs staleness gate
        run: uv run --no-sync python -m scripts.docgen --check
