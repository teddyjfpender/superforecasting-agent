[build-system]
requires = ["setuptools>=83,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "superforecasting-agent"
version = "0.22.0"
description = "Superforecasting Agent — a command-line forecasting desk that compounds judgment over time"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Superforecasting Agent Contributors" }]
license = "MIT"
dependencies = [
  # Core — every direct dep is exact-pinned to ==X.Y.Z (no ranges).
  # Rationale: ranges allow PyPI to ship a fresh version of a transitive
  # at any time without a code review on our side. Exact pins mean the
  # only way a new package version reaches a user is via an intentional
  # update on our end (bump the pin in this file, regenerate uv.lock).
  # This was tightened on 2026-05-12 in response to the Mini Shai-Hulud
  # worm hitting mistralai 2.4.6 on PyPI; if that release had been
  # captured by `mistralai>=2.3.0,<3` rather than an exact pin, every
  # install in the hours before the quarantine would have pulled it.
  #
  # When updating: bump the version below AND regenerate uv.lock with
  # `uv lock` so the transitive resolution stays consistent. Don't
  # introduce ranges back without a written justification.
  #
  # Scope rule: only packages used by EVERY Superforecasting Agent session belong here.
  # Anything that's provider-specific (`anthropic`, `firecrawl-py`,
  # `exa-py`, `fal-client`, `edge-tts`, `parallel-web`) belongs in an
  # extra and gets lazy-installed via `tools/lazy_deps.py` when the
  # user picks that backend. Smaller `dependencies` = smaller blast
  # radius for the next supply-chain attack.
  "openai==2.24.0",
  "python-dotenv==1.2.2",
  "fire==0.7.1",
  "httpx[socks]==0.28.1",
  "rich==14.3.3",
  "tenacity==9.1.4",
  "pyyaml==6.0.3",
  "ruamel.yaml==0.18.17",
  "requests==2.33.0",  # CVE-2026-25645
  "jinja2==3.1.6",
  "pydantic==2.12.5",
  # Interactive CLI (prompt_toolkit is used directly by cli.py)
  "prompt_toolkit==3.0.52",
  # Cron scheduler (built-in feature — scheduled cron/interval jobs use croniter).
  "croniter==6.0.0",
  # Skills Hub (GitHub App JWT auth — optional, only needed for bot identity)
  "PyJWT[crypto]==2.13.0",  # CVE-2026-48526
  # Windows has no IANA tzdata shipped with the OS, so Python's ``zoneinfo``
  # (PEP 615) raises ``ZoneInfoNotFoundError`` for every non-UTC timezone
  # out of the box.  ``tzdata`` ships the Olson database as a data package
  # Python resolves automatically.  No-op on Linux/macOS (which have
  # /usr/share/zoneinfo).  Credits: PR #13182 (@sprmn24).
  "tzdata==2025.3; sys_platform == 'win32'",
  # Cross-platform process / PID management.  `psutil` is the canonical
  # answer for "is this PID alive" and process-tree walking across Linux,
  # macOS and Windows.  It replaces POSIX-only idioms like `os.kill(pid, 0)`
  # (which is a silent killer on Windows — see CONTRIBUTING.md) and
  # `os.killpg` (which doesn't exist on Windows).
  "psutil==7.2.2",
]

[project.optional-dependencies]
# Native Anthropic provider — only needed when provider=anthropic (not via
# OpenRouter or other aggregators).
anthropic = ["anthropic==0.87.0"]
# Web search backends — each only loaded when the user picks it as their
# search provider (configured via `superforecasting-agent tools` or config.yaml).
exa = ["exa-py==2.10.2"]
firecrawl = ["firecrawl-py==4.17.0"]
parallel-web = ["parallel-web==0.4.2"]
# Image generation backends
fal = ["fal-client==0.13.1"]
# Edge TTS — default TTS provider but still optional (users can pick
# ElevenLabs / OpenAI / MiniMax instead).
edge-tts = ["edge-tts==7.2.7"]
modal = ["modal==1.3.4"]
daytona = ["daytona==0.155.0"]
vercel = ["vercel==0.5.7"]
hindsight = ["hindsight-client==0.6.1"]
dev = ["debugpy==1.8.20", "pytest==9.0.3", "pytest-asyncio==1.3.0", "pytest-xdist==3.8.0", "pytest-split==0.11.0", "pytest-timeout==2.4.0", "mcp==1.28.1", "ty==0.0.21", "ruff==0.15.10", "import-linter==2.13"]
messaging = ["python-telegram-bot[webhooks]==22.6", "discord.py==2.7.1", "PyNaCl==1.6.2", "davey==0.1.4", "aiohttp==3.14.3", "brotlicffi==1.2.0.1", "slack-bolt==1.27.0", "slack-sdk==3.40.1", "qrcode==7.4.2"]
cron = []  # croniter is now a core dependency; this extra kept for back-compat
slack = ["slack-bolt==1.27.0", "slack-sdk==3.40.1", "aiohttp==3.14.3"]
matrix = ["mautrix[encryption]==0.21.0", "Markdown==3.10.2", "aiosqlite==0.22.1", "asyncpg==0.31.0", "aiohttp-socks==0.11.0"]
cli = ["simple-term-menu==1.6.6"]
tts-premium = ["elevenlabs==1.59.0"]
voice = [
  # Local STT pulls in wheel-only transitive deps (ctranslate2, onnxruntime),
  # so keep it out of the base install for source-build packagers like Homebrew.
  "faster-whisper==1.2.1",
  "sounddevice==0.5.5",
  "numpy==2.4.3",
]
pty = [
  "ptyprocess==0.7.0; sys_platform != 'win32'",
  "pywinpty==2.0.15; sys_platform == 'win32'",
]
honcho = ["honcho-ai==2.0.1"]
mcp = ["mcp==1.28.1"]
homeassistant = ["aiohttp==3.14.3"]
sms = ["aiohttp==3.14.3"]
# Computer use — macOS background desktop control via cua-driver (MCP stdio).
# The cua-driver binary itself is installed via `superforecasting-agent tools` post-setup
# (curl install script); this extra just pins the MCP client used to talk
# to it, which is already provided by the `mcp` extra.
computer-use = ["mcp==1.28.1"]
acp = ["agent-client-protocol==0.9.0"]
# mistral: extra REMOVED 2026-05-12 — `mistralai` PyPI project quarantined
# after malicious 2.4.6 release (Mini Shai-Hulud worm). Every version of
# `mistralai` returns 404 on PyPI right now, so any pin we'd write is
# unresolvable, which breaks `uv lock --check` in CI.
#
# To restore once PyPI un-quarantines:
#   1. Verify the new release is clean (read the changelog, check Socket
#      advisory page, confirm no malicious code review findings).
#   2. Add back: mistral = ["mistralai==<verified-version>"]
#   3. Re-enable Mistral in:
#        - tools/lazy_deps.py (LAZY_DEPS["tts.mistral"], LAZY_DEPS["stt.mistral"])
#        - superforecasting_agent/runtime/tools_config.py (un-hide from provider picker)
#        - superforecasting_agent/runtime/web_server.py (re-add to dashboard STT options)
#        - tools/transcription_tools.py / tools/tts_tool.py (drop disabled stubs)
#   4. Run `uv lock` to regenerate transitives.
#   5. Optionally re-add to [all] only after a few days of clean operation.
bedrock = ["boto3==1.42.89"]
azure-identity = ["azure-identity==1.25.3"]
termux = [
  # Baseline Android / Termux path for reliable fresh installs.
  "python-telegram-bot[webhooks]==22.6",
  "superforecasting-agent[cron]",
  "superforecasting-agent[cli]",
  "superforecasting-agent[pty]",
  "superforecasting-agent[mcp]",
  "superforecasting-agent[honcho]",
  "superforecasting-agent[acp]",
]
termux-all = [
  # Best-effort "install all" profile for Termux. Same policy as [all]:
  # only includes extras that aren't covered by `tools/lazy_deps.py`.
  # Backends like telegram/slack/dingtalk/feishu/honcho lazy-install at
  # first use, so they're no longer eager-installed here.
  "superforecasting-agent[termux]",
  "superforecasting-agent[google]",
  "superforecasting-agent[homeassistant]",
  "superforecasting-agent[sms]",
  "superforecasting-agent[web]",
]
dingtalk = ["dingtalk-stream==0.24.3", "alibabacloud-dingtalk==2.2.42", "qrcode==7.4.2"]
feishu = ["lark-oapi==1.5.3", "qrcode==7.4.2"]
google = [
  # Required by the google-workspace skill (Gmail, Calendar, Drive, Contacts,
  # Sheets, Docs).  Declared here so packagers (Nix, Homebrew) ship them with
  # the [all] extra and users don't hit runtime `pip install` paths that fail
  # in environments without pip (e.g. Nix-managed Python).
  "google-api-python-client==2.194.0",
  "google-auth-oauthlib==1.3.1",
  "google-auth-httplib2==0.3.1",
]
youtube = [
  # Required by skills/media/youtube-content and
  # optional-skills/productivity/memento-flashcards (youtube_quiz.py).
  # Without this declaration uv sync omits the package and both skills fail
  # at first invocation with ModuleNotFoundError (issue #22243).
  "youtube-transcript-api==1.2.4",
]
# `superforecasting-agent dashboard` (localhost SPA + API). Not in core to keep the default install lean.
web = ["fastapi==0.133.1", "uvicorn[standard]==0.41.0"]
all = [
  # Policy (2026-05-12): `[all]` includes only extras that genuinely
  # CAN'T be lazy-installed via `tools/lazy_deps.py` — i.e. things every
  # session can use, things needed before the agent loop is alive
  # (terminal/CLI), and skill deps that packagers (Nix, AUR, Homebrew)
  # need in the wheel. Anything an opt-in backend (provider, search,
  # TTS, image, memory, messaging platform, terminal sandbox) needs
  # MUST live exclusively in `LAZY_DEPS` and resolve at first use —
  # otherwise one quarantined PyPI release breaks every fresh install.
  #
  # Removed from [all] on 2026-05-12 (covered by lazy-install):
  #   anthropic, exa, firecrawl, parallel-web, fal, edge-tts,
  #   modal, daytona, vercel, messaging (telegram/discord/slack),
  #   matrix, slack, honcho, voice (faster-whisper),
  #   dingtalk, feishu, bedrock, tts-premium (elevenlabs)
  #
  # Why: the matrix extra in particular pulls `mautrix[encryption]`
  # which depends on `python-olm`. python-olm has Linux-only wheels and
  # no native build path on Windows or modern macOS. With matrix in
  # [all], `uv sync --locked` on Windows tried to build it from sdist
  # and failed on `make`. Lazy-install routes that build to first use,
  # where the user is expected to have a toolchain available.
  "superforecasting-agent[cron]",
  "superforecasting-agent[cli]",
  "superforecasting-agent[dev]",
  "superforecasting-agent[pty]",
  "superforecasting-agent[mcp]",
  "superforecasting-agent[homeassistant]",
  "superforecasting-agent[sms]",
  "superforecasting-agent[acp]",
  "superforecasting-agent[google]",
  "superforecasting-agent[web]",
  "superforecasting-agent[youtube]",
]

[dependency-groups]
# NumPy is optional at runtime (it otherwise arrives through the heavy [voice]
# extra), but the full suite must exercise both thesis Monte Carlo backends.
full-test = ["numpy==2.4.3"]

[project.scripts]
forecast = "superforecasting_agent.cli:main"
superforecast = "superforecasting_agent.cli:main"
superforecasting-agent = "superforecasting_agent.cli:main"
superforecasting-agent-host = "superforecasting_agent.hosting.__main__:main"
superforecasting-agent-acp = "acp_adapter.entry:main"
superforecast-acp = "acp_adapter.entry:main"
hermes = "superforecasting_agent.cli:main"
hermes-agent = "superforecasting_agent.cli:main"
hermes-acp = "acp_adapter.entry:main"

[tool.setuptools]
py-modules = ["run_agent", "cli"]

[tool.setuptools.package-data]
"superforecasting_agent.runtime" = ["scripts/install.sh", "scripts/install.ps1"]
gateway = ["assets/**/*"]
forecasting = [
  "trial_compatibility.json",
  "data/*.csv",
  "data/*.md",
  "change_control/schemas/*.json",
  "workspace/*.md",
  "workspace/schemas/*.json",
  "workspace/schemas/*.md",
]
plugins = [
  "**/plugin.yaml",
  "**/plugin.yml",
  "*/dashboard/manifest.json",
  "*/dashboard/dist/*",
  "*/dashboard/dist/**/*",
]

[tool.setuptools.exclude-package-data]
"superforecasting_agent.runtime" = ["web_dist/*", "web_dist/**/*", "tui_dist/*", "tui_dist/**/*"]

[tool.setuptools.packages.find]
exclude = ["*.tui_dist", "*.tui_dist.*", "*.web_dist", "*.web_dist.*"]
include = ["protocol", "protocol.*", "agent", "agent.*", "tools", "tools.*", "gateway", "gateway.*", "tui_gateway", "tui_gateway.*", "cron", "acp_adapter", "plugins", "plugins.*", "providers", "providers.*", "forecasting", "forecasting.*", "superforecasting_agent", "superforecasting_agent.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services (API keys, Modal, etc.)",
    "real_concurrent_gate: opt out of the autouse stub that disables _detect_concurrent_hermes_instances",
    "ssh: marks tests requiring SSH access/configuration",
    # Hermetic-CI discipline: a test that genuinely cannot run without live
    # network and/or real provider credentials carries one (or both) of these.
    # They stay OFF the default + release runs (both exclude them explicitly)
    # and are opt-in via HERMES_LIVE_TESTS=1 with the relevant key configured.
    # Do NOT reach for these to paper over an env-coupled test that CAN be made
    # hermetic — fix the test instead (see CONTRIBUTING.md → Hermetic tests).
    "requires_network: test performs real outbound network I/O (live API/HTTP).",
    "requires_credentials: test needs real provider credentials to run.",
]
filterwarnings = [
    # Async lifecycle leaks are correctness bugs, not ignorable test noise.
    'error::RuntimeWarning',
    'error::ResourceWarning',
    'error::pytest.PytestUnraisableExceptionWarning',
    'error::pytest.PytestUnhandledThreadExceptionWarning',
    # opentelemetry's importlib_metadata compatibility shim uses the deprecated
    # SelectableGroups dict interface under Python 3.11 when imported by acp.
    'ignore:SelectableGroups dict interface is deprecated. Use select.:DeprecationWarning',
    # Starlette/FastAPI currently warns about its httpx-backed TestClient on import.
    'ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.:UserWarning',
    # discord.py imports Python 3.11's deprecated stdlib audioop module; its
    # Python 3.13 path uses the maintained audioop-lts compatibility package.
    "ignore:'audioop' is deprecated and slated for removal in Python 3.13:DeprecationWarning:discord.player",
]
# pytest-timeout is the single deadline owner. CLI --timeout overrides this
# default, and explicitly marked lifecycle/soak tests can declare larger budgets.
addopts = "-m 'not integration' -n auto --timeout=30 --timeout-method=signal"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unknown-argument = "warn"
redundant-cast = "ignore"

[tool.ruff]
preview = true  # required for PLW1514 (unspecified-encoding) — preview rule

[tool.ruff.lint]
# All other lints are intentionally disabled (see comment history on this
# file) while we wrangle typechecks — but PLW1514 is too load-bearing to
# keep off.  Bare open()/read_text()/write_text() in text mode defaults to
# the system locale encoding on Windows (cp1252 on US-locale installs),
# which silently corrupts any non-ASCII file content.  We had three
# separate Windows sandbox regressions in one debug session before
# adding the explicit encoding.  This rule keeps new code honest.
select = ["PLW1514"]

[tool.ruff.lint.per-file-ignores]
# Tests can intentionally exercise locale-encoding edge cases.
"tests/**" = ["PLW1514"]
# Skills and plugins are partially user-authored — their own conventions.
"skills/**" = ["PLW1514"]
"optional-skills/**" = ["PLW1514"]
"plugins/**" = ["PLW1514"]

# ─────────────────────────────────────────────────────────────────────────────
# Architecture contracts (import-linter / grimp). Wave-0 formality layer of the
# 2026-07-10 modularization program (docs/plans/2026-07-10-modularization-program.md
# §W0.1). grimp's AST scan sees FUNCTION-LEVEL imports too, so the ~2,100 lazy
# edges are visible to contracts rather than laundered. Run: `lint-imports`
# (exit-code gated). CI: .github/workflows/lint.yml → lint-architecture.
#
# Enforcement tiers:
#   1. ENFORCE NOW (already true, 0 violations): protocol purity; ledger↛cli;
#      forecasting↛tui_gateway.
#   2. RATCHET (frozen violation lists below — they may only SHRINK, never grow):
#      *↛run_agent (the inverted entry-script edge); forecasting↛superforecasting_agent.runtime;
#      forecasting↛tools.
[tool.importlinter]
root_packages = [
    "forecasting",
    "protocol",
    "cron",
    "acp_adapter",
    "tui_gateway",
    "tools",
    "agent",
    "gateway",
    "superforecasting_agent",
]
# run_agent.py / cli.py are top-level MODULES (not packages), so they are seen as
# "external" nodes; this must be true for the *↛run_agent forbidden contract.
include_external_packages = true

# ── Tier 1: enforce now ──────────────────────────────────────────────────────
[[tool.importlinter.contracts]]
name = "protocol is a pure kernel (imports nothing app-side)"
type = "forbidden"
source_modules = ["protocol"]
forbidden_modules = ["forecasting", "tools", "agent", "gateway", "tui_gateway", "superforecasting_agent", "run_agent", "cli"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "forecasting.ledger never imports forecasting.cli"
type = "forbidden"
source_modules = ["forecasting.ledger"]
forbidden_modules = ["forecasting.cli"]
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "forecasting never imports tui_gateway (already clean; enforce before it decays)"
type = "forbidden"
source_modules = ["forecasting"]
forbidden_modules = ["tui_gateway"]
allow_indirect_imports = "true"

# ── Tier 2: ratchets (frozen lists — shrink only) ────────────────────────────
[[tool.importlinter.contracts]]
name = "products and services never import the run_agent entry script"
type = "forbidden"
source_modules = ["forecasting", "tools", "agent", "gateway", "tui_gateway", "superforecasting_agent", "cli", "cron", "acp_adapter"]
forbidden_modules = ["run_agent"]
allow_indirect_imports = "true"


[[tool.importlinter.contracts]]
name = "forecasting↛superforecasting_agent.runtime (kernel seam; ratchet)"
type = "forbidden"
source_modules = ["forecasting"]
forbidden_modules = ["superforecasting_agent.runtime"]
allow_indirect_imports = "true"
ignore_imports = [
    "forecasting.cli.collaboration_admin -> superforecasting_agent.runtime.config",
    "forecasting.cli.core -> superforecasting_agent.runtime.config",
    "forecasting.cli.core -> superforecasting_agent.runtime.env_loader",
    "forecasting.cli.markets_pm -> superforecasting_agent.runtime.config",
    "forecasting.cli.quorum_panel -> superforecasting_agent.runtime.config",
    "forecasting.cli.refresh_cycle -> superforecasting_agent.runtime.config",
    "forecasting.jobs.__main__ -> superforecasting_agent.runtime.plugins",
    "forecasting.market_nightly_forecaster -> superforecasting_agent.runtime.plugins",
    "forecasting.quorum.panels -> superforecasting_agent.runtime.models",
]

[[tool.importlinter.contracts]]
name = "forecasting↛tools (ratchet)"
type = "forbidden"
source_modules = ["forecasting"]
forbidden_modules = ["tools"]
allow_indirect_imports = "true"
ignore_imports = [
    "forecasting.cli.connect_admin -> tools.slack_tool",
    "forecasting.cli.core -> tools.forecasting_tool",
    "forecasting.cli.questions_admin -> tools.forecasting_tool",
    "forecasting.cli.refresh_cycle -> tools.forecasting_tool",
    "forecasting.cli.slack_admin -> tools.forecast_actions.share",
    "forecasting.cli.slack_admin -> tools.slack_tool",
    "forecasting.cli.triage_calibration -> tools.forecasting_tool",
    "forecasting.collab.directory -> tools.slack_tool",
    "forecasting.cron_runner -> tools.forecasting_tool",
    "forecasting.jobs.types.refresh -> tools.forecasting_tool",
    "forecasting.market_model -> tools.forecasting_tool",
    "forecasting.market_model -> tools.market_presentation_tool",
    "forecasting.market_model -> tools.terminal_tool",
    "forecasting.notify -> tools.slack_tool",
    "forecasting.supervisor_search -> tools.web_tools",
]


[[tool.importlinter.contracts]]
name = "forecast application operations do not import product entrypoints"
type = "forbidden"
source_modules = ["forecasting.application"]
forbidden_modules = ["forecasting.cli", "forecasting.interfaces", "forecasting.dashboard", "tui_gateway", "gateway", "cli", "superforecasting_agent.runtime.main"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "TUI host never imports classic CLI presentation"
type = "forbidden"
source_modules = ["tui_gateway.server"]
forbidden_modules = ["cli"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "session application services do not import presentation or transport"
type = "forbidden"
source_modules = ["superforecasting_agent.application"]
forbidden_modules = ["cli", "run_agent", "tui_gateway", "gateway", "superforecasting_agent.runtime.main", "superforecasting_agent.runtime.session_browser"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "forecast execution consumers do not import CLI orchestration"
type = "forbidden"
source_modules = ["forecasting.jobs.types.reforecast", "tools.forecast_actions.forecast_update", "agent.forecast_stage", "forecasting.cron_runner", "tools.delegate_tool", "tools.forecast_actions.diagnostics"]
forbidden_modules = ["forecasting.cli", "cli"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "distribution interpretation is independent of storage and presentation"
type = "forbidden"
source_modules = ["forecasting.distribution_summary"]
forbidden_modules = ["forecasting.ledger", "forecasting.dashboard", "forecasting.cli", "agent", "tools", "gateway", "tui_gateway", "superforecasting_agent", "cli", "run_agent"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "ledger and distribution checks never import the dashboard"
type = "forbidden"
source_modules = ["forecasting.ledger", "forecasting.distribution", "forecasting.hooks.distribution"]
forbidden_modules = ["forecasting.dashboard"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "subscription eligibility does not own interactive setup"
type = "forbidden"
source_modules = ["superforecasting_agent.runtime.nous_subscription"]
forbidden_modules = ["superforecasting_agent.runtime.setup", "superforecasting_agent.runtime.oauth_setup", "cli"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "profile identity is independent of runtime management and presentation"
type = "forbidden"
source_modules = ["superforecasting_agent.constants"]
forbidden_modules = ["superforecasting_agent.runtime", "gateway", "tui_gateway", "cli"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "profile admission is independent of runtime administration"
type = "forbidden"
source_modules = ["superforecasting_agent.profile_paths"]
forbidden_modules = ["superforecasting_agent.runtime", "gateway", "tui_gateway", "cli"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "cron profile selection does not import profile administration"
type = "forbidden"
source_modules = ["cron.jobs", "cron.scheduler"]
forbidden_modules = ["superforecasting_agent.runtime.profiles"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "tool selection does not import interactive configuration"
type = "forbidden"
source_modules = ["superforecasting_agent.tooling.selection", "tui_gateway.tools_rpc", "gateway.session"]
forbidden_modules = ["superforecasting_agent.runtime.tools_config", "superforecasting_agent.runtime.setup", "cli"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "shared session context is independent of runtime hosting and presentation"
type = "forbidden"
source_modules = ["superforecasting_agent.session_context"]
forbidden_modules = ["superforecasting_agent.runtime", "gateway", "tui_gateway", "cli", "agent", "tools"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "platform registration is independent of messaging transports"
type = "forbidden"
source_modules = ["superforecasting_agent.platform_registry"]
forbidden_modules = ["superforecasting_agent.runtime", "gateway", "tui_gateway", "cli", "agent", "tools"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "shared process and media infrastructure never imports presentation"
